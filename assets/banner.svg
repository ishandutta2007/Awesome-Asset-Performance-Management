<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Effects -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Pulsing Node Animation -->
    <style>
      .pulse-line {
        stroke-dasharray: 8, 8;
        animation: dash 30s linear infinite;
      }
      .wave-path {
        animation: wave 4s ease-in-out infinite alternate;
      }
      .glow-circle {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes wave {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Dynamic Dynamic Decorative Signal Waveforms in Background -->
  <g opacity="0.25" class="wave-path">
    <path d="M 0 220 Q 200 150 400 210 T 800 180 T 1200 230" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glowCyan)"/>
    <path d="M 0 250 Q 300 180 600 240 T 1200 190" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Dynamic Connecting Tech Grid Lines -->
  <g stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" class="pulse-line">
    <line x1="100" y1="50" x2="1100" y2="50" />
    <line x1="100" y1="250" x2="1100" y2="250" />
    <line x1="150" y1="20" x2="150" y2="280" />
    <line x1="1050" y1="20" x2="1050" y2="280" />
  </g>

  <!-- Animated Background Nodes -->
  <circle cx="150" cy="50" r="4" fill="#38bdf8" class="glow-circle"/>
  <circle cx="1050" cy="50" r="4" fill="#38bdf8" class="glow-circle"/>
  <circle cx="150" cy="250" r="4" fill="#38bdf8" class="glow-circle"/>
  <circle cx="1050" cy="250" r="4" fill="#38bdf8" class="glow-circle"/>

  <!-- Glowing Accent Orbs (Positioned safely away from text) -->
  <circle cx="100" cy="150" r="80" fill="#0284c7" opacity="0.15" filter="url(#glowBlue)"/>
  <circle cx="1100" cy="150" r="80" fill="#6366f1" opacity="0.15" filter="url(#glowBlue)"/>

  <!-- Text Foreground Layer (Clear, Unobstructed, Centered) -->
  <g text-anchor="middle">
    <!-- Subtitle Badge -->
    <rect x="420" y="48" width="360" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="600" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="2">
      ULTIMATE APM &amp; CMMS ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5" filter="url(#glowCyan)">
      Awesome Asset Performance Management
    </text>

    <!-- Tagline / Subtitle -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Curated Industrial APM, Enterprise EAM, CMMS &amp; Predictive Maintenance Solutions
    </text>

    <!-- Feature Pills -->
    <g transform="translate(360, 215)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="19" fill="#e2e8f0">⚡ Predictive AI</text>

      <!-- Pill 2 -->
      <rect x="170" y="0" width="140" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="240" y="19" fill="#e2e8f0">🛠️ Work Orders</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="140" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="410" y="19" fill="#e2e8f0">📊 Asset Health</text>
    </g>
  </g>
</svg>
