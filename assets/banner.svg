<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowBlue" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes wave{0%{transform:translateY(0)}}@keyframes pulse{0%{opacity:.3;transform:scale(.98)}}.pulse-line{stroke-dasharray:8,8;animation:dash 30s linear infinite}.wave-path{animation:wave 4s ease-in-out infinite alternate}.glow-circle{animation:pulse 3s ease-in-out infinite alternate}</style></defs><rect width="1200" height="300" fill="url(#bgGradient)"/><rect width="1200" height="300" fill="url(#grid)"/><g class="wave-path" opacity=".25"><path fill="none" stroke="#38bdf8" stroke-width="3" d="M 0 220 Q 200 150 400 210 T 800 180 T 1200 230" filter="url(#glowCyan)"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 0 250 Q 300 180 600 240 T 1200 190"/></g><g stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" class="pulse-line"><line x1="100" x2="1100" y1="50" y2="50"/><line x1="100" x2="1100" y1="250" y2="250"/><line x1="150" x2="150" y1="20" y2="280"/><line x1="1050" x2="1050" y1="20" y2="280"/></g><circle cx="150" cy="50" r="4" fill="#38bdf8" class="glow-circle"/><circle cx="1050" cy="50" r="4" fill="#38bdf8" class="glow-circle"/><circle cx="150" cy="250" r="4" fill="#38bdf8" class="glow-circle"/><circle cx="1050" cy="250" r="4" fill="#38bdf8" class="glow-circle"/><circle cx="100" cy="150" r="80" fill="#0284c7" filter="url(#glowBlue)" opacity=".15"/><circle cx="1100" cy="150" r="80" fill="#6366f1" filter="url(#glowBlue)" opacity=".15"/><g text-anchor="middle"><rect width="360" height="28" x="420" y="48" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="14"/><text x="600" y="67" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">ULTIMATE APM &amp; CMMS ECOSYSTEM</text><text x="600" y="135" fill="#fff" filter="url(#glowCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-.5">Awesome Asset Performance Management</text><text x="600" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing=".5">Curated Industrial APM, Enterprise EAM, CMMS &amp; Predictive Maintenance Solutions</text><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" transform="translate(360, 215)"><rect width="140" height="30" x="0" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="70" y="19" fill="#e2e8f0">⚡ Predictive AI</text><rect width="140" height="30" x="170" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="240" y="19" fill="#e2e8f0">🛠️ Work Orders</text><rect width="140" height="30" x="340" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="410" y="19" fill="#e2e8f0">📊 Asset Health</text></g></g></svg>